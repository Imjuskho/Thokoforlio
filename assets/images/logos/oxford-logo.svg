<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 135" width="120" height="135" role="img" aria-label="University of Oxford Crest">
  <!-- Oxford Crest Shield & Crown / Book Emblem -->
  <defs>
    <linearGradient id="oxfordGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#B88A28"/>
    </linearGradient>
  </defs>
  <!-- Shield Outline -->
  <path d="M12 12 H108 V72 C108 104 60 126 60 126 C60 126 12 104 12 72 Z" fill="#002147" stroke="#C8A96E" stroke-width="3" stroke-linejoin="round"/>
  <!-- Inner Shield Inset -->
  <path d="M18 18 H102 V71 C102 98 60 118 60 118 C60 118 18 98 18 71 Z" fill="none" stroke="#C8A96E" stroke-width="1" opacity="0.6"/>
  <!-- Top Left Crown -->
  <g fill="url(#oxfordGold)" stroke="#8A6514" stroke-width="0.5">
    <path d="M26 38 L30 28 L37 34 L44 26 L51 34 L58 28 L62 38 Z"/>
    <rect x="26" y="38" width="36" height="4" rx="1"/>
  </g>
  <!-- Top Right Crown -->
  <g fill="url(#oxfordGold)" stroke="#8A6514" stroke-width="0.5" transform="translate(32, 0)">
    <path d="M26 38 L30 28 L37 34 L44 26 L51 34 L58 28 L62 38 Z"/>
    <rect x="26" y="38" width="36" height="4" rx="1"/>
  </g>
  <!-- Open Book in Center -->
  <g transform="translate(60, 68)">
    <!-- Book Pages -->
    <path d="M-32 -14 C-18 -18 -4 -16 0 -10 C4 -16 18 -18 32 -14 V16 C18 12 4 14 0 20 C-4 14 -18 12 -32 16 Z" fill="#FFFFFF" stroke="#C8A96E" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Center Spine -->
    <line x1="0" y1="-10" x2="0" y2="20" stroke="#002147" stroke-width="1.5"/>
    <!-- Book Bookmark ribbons / seals -->
    <path d="M-36 -8 H-32 M-36 0 H-32 M-36 8 H-32 M32 -8 H36 M32 0 H36 M32 8 H36" stroke="url(#oxfordGold)" stroke-width="2"/>
    <!-- Page text lines hint -->
    <path d="M-26 -6 H-6 M-26 -1 H-6 M-26 4 H-6 M-26 9 H-10 M6 -6 H26 M6 -1 H26 M6 4 H26 M6 9 H22" stroke="#002147" stroke-width="1" opacity="0.45"/>
  </g>
  <!-- Bottom Center Crown -->
  <g fill="url(#oxfordGold)" stroke="#8A6514" stroke-width="0.5" transform="translate(16, 68)">
    <path d="M28 35 L32 26 L38 31 L44 24 L50 31 L56 26 L60 35 Z"/>
    <rect x="28" y="35" width="32" height="3.5" rx="1"/>
  </g>
</svg>
